<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的</title>
    <style id="theme-vars">
/* ==========================================================================
   LocalFit AI — Brand CSS
   Primary hue: mint (#2FBE8F) — single brand color system
   Category data-viz tokens: protein / carbs / fat / water / weight
   ========================================================================== */

/* ---- Light Mode (default) ---- */
:root {
  /* Brand ramp — mint tonal scale */
  --lf-mint-50:  #ECFBF5;
  --lf-mint-100: #D2F5E6;
  --lf-mint-200: #A8EBCF;
  --lf-mint-300: #6FDBB0;
  --lf-mint-400: #4ED9A6;
  --lf-mint-500: #2FBE8F;   /* anchor */
  --lf-mint-600: #22A877;
  --lf-mint-700: #1B8A62;
  --lf-mint-800: #166B4D;
  --lf-mint-900: #114A36;

  /* Neutral ramp */
  --lf-neutral-50:  #F7F9F8;
  --lf-neutral-100: #EFF3F1;
  --lf-neutral-200: #DDE5E1;
  --lf-neutral-300: #B8C6C0;
  --lf-neutral-400: #8FA09A;
  --lf-neutral-500: #6B7E78;
  --lf-neutral-600: #556760;
  --lf-neutral-700: #3D4A45;
  --lf-neutral-800: #2A342F;
  --lf-neutral-900: #1A201D;

  /* Category data-viz tokens (domain-specific, not brand identity) */
  --lf-protein: #FF8A65;   /* peach — protein */
  --lf-protein-100: #FFE5DC;
  --lf-carbs: #FFC94D;     /* honey — carbs */
  --lf-carbs-100: #FFF4D6;
  --lf-fat: #B39DDB;       /* taro — fat */
  --lf-fat-100: #EDE6F7;
  --lf-water: #A8C4D9;    /* salt — water */
  --lf-weight: #C9A27E;   /* cocoa — weight */

  /* State tokens */
  --lf-state-success: #2FBE8F;
  --lf-state-success-foreground: #FFFFFF;
  --lf-state-warning: #FF9800;
  --lf-state-warning-foreground: #FFFFFF;
  --lf-state-error: #F44336;
  --lf-state-error-foreground: #FFFFFF;
  --lf-state-info: #42A5F5;
  --lf-state-info-foreground: #FFFFFF;

  /* Evidence tokens */
  --lf-evidence-a: #D2F5E6;   /* mint100 — confirmed */
  --lf-evidence-b: #FFF4D6;   /* honey100 — estimated */
  --lf-evidence-c: #EDE6F7;   /* taro100 — incomplete */

  /* Semantic surface tokens */
  --lf-background: #F7F9F8;
  --lf-foreground: #1A201D;
  --lf-card: #FFFFFF;
  --lf-card-foreground: #1A201D;
  --lf-popover: #FFFFFF;
  --lf-popover-foreground: #1A201D;
  --lf-muted: #EFF3F1;
  --lf-muted-foreground: #6B7E78;
  --lf-border: #DDE5E1;
  --lf-input: #DDE5E1;
  --lf-ring: #2FBE8F;

  /* Primary */
  --lf-primary: #2FBE8F;
  --lf-primary-foreground: #FFFFFF;

  /* Radius scale — restrained 4/8/12/16px */
  --lf-radius-xs: 4px;
  --lf-radius-sm: 8px;
  --lf-radius-md: 12px;
  --lf-radius-lg: 16px;
  --lf-radius-xl: 16px;
  --lf-radius-2xl: 16px;
  --lf-radius-full: 9999px;

  /* Shadows — static surfaces <= 0.05 alpha */
  --lf-shadow-1: 0 1px 3px rgba(15, 36, 28, 0.04), 0 1px 2px rgba(15, 36, 28, 0.03);
  /* Floating-layer shadows (modal/popover/dropdown/drawer/overlay only) */
  --lf-shadow-float: 0 8px 24px -8px rgba(15, 36, 28, 0.04);
  --lf-shadow-float-lg: 0 24px 60px -20px rgba(15, 36, 28, 0.05);

  /* Hero gradient (mint500 → mint200 → mint50, 135deg) */
  --lf-hero-gradient: linear-gradient(135deg, #2FBE8F 0%, #A8EBCF 55%, #ECFBF5 100%);

  /* Typography */
  --lf-font-sans: "PingFang SC", "Noto Sans SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --lf-font-display: "PingFang SC", "Noto Sans SC", "HarmonyOS Sans SC", system-ui, sans-serif;
  --lf-font-mono: "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
}

/* ---- Dark Mode ---- */
html.dark {
  /* Brand ramp — mint提亮至400 in dark */
  --lf-mint-50:  #0F1412;
  --lf-mint-100: #1F2823;
  --lf-mint-200: #242E28;
  --lf-mint-300: #2A3A32;
  --lf-mint-400: #4ED9A6;   /* dark anchor (提亮) */
  --lf-mint-500: #2FBE8F;
  --lf-mint-600: #22A877;
  --lf-mint-700: #1B8A62;
  --lf-mint-800: #166B4D;
  --lf-mint-900: #114A36;

  /* Neutral ramp — 分层深色 */
  --lf-neutral-50:  #0F1412;
  --lf-neutral-100: #171E1A;
  --lf-neutral-200: #1F2823;
  --lf-neutral-300: #2A342F;
  --lf-neutral-400: #3D4A45;
  --lf-neutral-500: #556760;
  --lf-neutral-600: #6B7E78;
  --lf-neutral-700: #8FA09A;
  --lf-neutral-800: #B8C6C0;
  --lf-neutral-900: #DDE5E1;

  /* Category colors — 提亮并降饱和5% */
  --lf-protein: #FF9D7E;
  --lf-protein-100: #3A2820;
  --lf-carbs: #FFD56B;
  --lf-carbs-100: #3A3320;
  --lf-fat: #C3B0E5;
  --lf-fat-100: #2A2438;
  --lf-water: #B4D0E5;
  --lf-weight: #D4B08E;

  /* State tokens */
  --lf-state-success: #4ED9A6;
  --lf-state-success-foreground: #0F1412;
  --lf-state-warning: #FFB74D;
  --lf-state-warning-foreground: #0F1412;
  --lf-state-error: #EF5350;
  --lf-state-error-foreground: #FFFFFF;
  --lf-state-info: #64B5F6;
  --lf-state-info-foreground: #0F1412;

  /* Evidence tokens */
  --lf-evidence-a: #1F2823;
  --lf-evidence-b: #2A2438;
  --lf-evidence-c: #242E28;

  /* Semantic surface tokens */
  --lf-background: #0F1412;
  --lf-foreground: #DDE5E1;
  --lf-card: #171E1A;
  --lf-card-foreground: #DDE5E1;
  --lf-popover: #1F2823;
  --lf-popover-foreground: #DDE5E1;
  --lf-muted: #1F2823;
  --lf-muted-foreground: #8FA09A;
  --lf-border: #2A342F;
  --lf-input: #2A342F;
  --lf-ring: #4ED9A6;

  /* Primary */
  --lf-primary: #4ED9A6;
  --lf-primary-foreground: #0F1412;

  /* Hero gradient — dark */
  --lf-hero-gradient: linear-gradient(135deg, #166B4D 0%, #1B8A62 50%, #0F1412 100%);

  /* Shadows — 暗色用outline替代 */
  --lf-shadow-1: 0 0 0 1px rgba(255, 255, 255, 0.04);
  --lf-shadow-float: 0 8px 24px -8px rgba(0, 0, 0, 0.04);
  --lf-shadow-float-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.05);
}

/* ---- Base Typography ---- */
body {
  font-family: var(--lf-font-sans);
  font-feature-settings: "tnum" 1, "cv01" 1;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Display number family — w800 tabular figures */
.lf-display {
  font-family: var(--lf-font-display);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  line-height: 1.0;
}

/* Tabular numbers for all data values */
.lf-num {
  font-variant-numeric: tabular-nums;
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--lf-background);
    --color-foreground: var(--lf-foreground);
    --color-card: var(--lf-card);
    --color-card-foreground: var(--lf-card-foreground);
    --color-popover: var(--lf-popover);
    --color-popover-foreground: var(--lf-popover-foreground);
    --color-primary: var(--lf-primary);
    --color-primary-foreground: var(--lf-primary-foreground);
    --color-muted: var(--lf-muted);
    --color-muted-foreground: var(--lf-muted-foreground);
    --color-border: var(--lf-border);
    --color-input: var(--lf-input);
    --color-ring: var(--lf-ring);
    --radius-sm: var(--lf-radius-sm);
    --radius-md: var(--lf-radius-md);
    --radius-lg: var(--lf-radius-lg);
    --radius-xl: var(--lf-radius-xl);
  }
  @layer base {
    body { background: var(--lf-background); color: var(--lf-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

<body class="max-w-md mx-auto min-h-screen font-sans antialiased" style="background:var(--lf-background)">
    <main class="pb-[80px]">

      <!-- ===== IDENTITY CARD ===== -->
      <section class="px-4 pt-5">
        <div class="relative overflow-hidden rounded-[16px] p-5" style="background:var(--lf-hero-gradient);box-shadow:var(--lf-shadow-1)">
          <!-- Pattern texture: white dots overlay -->
          <div class="absolute inset-0 pointer-events-none" style="background-image:radial-gradient(color-mix(in srgb, var(--lf-card) 50%, transparent) 1px, transparent 1px);background-size:14px 14px;opacity:0.1"></div>

          <!-- Content -->
          <div class="relative flex flex-col items-center">
            <!-- Avatar -->
            <div class="w-16 h-16 rounded-full flex items-center justify-center backdrop-blur" style="background:color-mix(in srgb, var(--lf-card) 20%, transparent)">
              <span class="text-xl font-bold" style="color:var(--lf-primary-foreground)">Fit</span>
            </div>
            <!-- Name -->
            <h1 class="text-lg font-semibold mt-2" style="color:var(--lf-primary-foreground)">小Fit</h1>
            <!-- Subtitle -->
            <p class="text-xs text-center mt-0.5 lf-num" style="color:color-mix(in srgb, var(--lf-primary-foreground) 80%, transparent)">已坚持 128 天 · 目标减脂 5kg</p>
            <!-- Edit profile button -->
            <button id="cta-edit-profile" class="flex items-center gap-1 rounded-full px-3 py-1 text-xs mt-2 backdrop-blur" style="background:color-mix(in srgb, var(--lf-card) 15%, transparent);color:var(--lf-primary-foreground)">
              <i data-lucide="pencil" class="w-3 h-3"></i>
              <span>编辑资料</span>
            </button>
          </div>

          <!-- Stats row -->
          <div class="relative flex justify-around mt-4">
            <div class="flex flex-col items-center">
              <span class="lf-display text-lg lf-num" style="color:var(--lf-primary-foreground)">65.2 kg</span>
              <span class="text-[10px] mt-1" style="color:color-mix(in srgb, var(--lf-primary-foreground) 70%, transparent)">当前体重</span>
            </div>
            <div class="flex flex-col items-center">
              <span class="lf-display text-lg lf-num" style="color:var(--lf-primary-foreground)">5,840</span>
              <span class="text-[10px] mt-1" style="color:color-mix(in srgb, var(--lf-primary-foreground) 70%, transparent)">总记录</span>
            </div>
            <div class="flex flex-col items-center">
              <span class="lf-display text-lg lf-num" style="color:var(--lf-primary-foreground)">128</span>
              <span class="text-[10px] mt-1" style="color:color-mix(in srgb, var(--lf-primary-foreground) 70%, transparent)">连续天数</span>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== HEALTH METRICS ===== -->
      <section class="px-4 mt-4">
        <h2 class="text-xs font-medium mb-2 px-1" style="color:var(--lf-muted-foreground)">健康数据</h2>
        <div class="grid grid-cols-3 gap-2">
          <div class="rounded-[16px] p-3 flex flex-col items-center" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border:1px solid var(--lf-border)">
            <span class="lf-display text-lg lf-num" style="color:var(--lf-primary)">22.6</span>
            <span class="text-[10px] mt-1 text-center" style="color:var(--lf-muted-foreground)">BMI</span>
          </div>
          <div class="rounded-[16px] p-3 flex flex-col items-center" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border:1px solid var(--lf-border)">
            <span class="lf-display text-lg lf-num" style="color:var(--lf-primary)">1,480</span>
            <span class="text-[10px] mt-1 text-center" style="color:var(--lf-muted-foreground)">基础代谢率</span>
          </div>
          <div class="rounded-[16px] p-3 flex flex-col items-center" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border:1px solid var(--lf-border)">
            <span class="lf-display text-lg lf-num" style="color:var(--lf-primary)">2.0L</span>
            <span class="text-[10px] mt-1 text-center" style="color:var(--lf-muted-foreground)">水分摄入目标</span>
          </div>
        </div>
      </section>

      <!-- ===== ACHIEVEMENTS ===== -->
      <section class="px-4 mt-4">
        <h2 class="text-xs font-medium mb-2 px-1" style="color:var(--lf-muted-foreground)">成就</h2>
        <div class="grid grid-cols-4 gap-2">
          <div class="rounded-[16px] p-3 flex flex-col items-center" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border:1px solid var(--lf-border)">
            <div class="w-9 h-9 rounded-full flex items-center justify-center mb-1.5" style="background:var(--lf-mint-100)">
              <i data-lucide="flame" class="w-4 h-4" style="color:var(--lf-mint-600)"></i>
            </div>
            <span class="text-[10px] text-center leading-tight" style="color:var(--lf-foreground)">7天连续打卡</span>
          </div>
          <div class="rounded-[16px] p-3 flex flex-col items-center" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border:1px solid var(--lf-border)">
            <div class="w-9 h-9 rounded-full flex items-center justify-center mb-1.5" style="background:var(--lf-mint-100)">
              <i data-lucide="salad" class="w-4 h-4" style="color:var(--lf-mint-600)"></i>
            </div>
            <span class="text-[10px] text-center leading-tight" style="color:var(--lf-foreground)">营养达人</span>
          </div>
          <div class="rounded-[16px] p-3 flex flex-col items-center" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border:1px solid var(--lf-border)">
            <div class="w-9 h-9 rounded-full flex items-center justify-center mb-1.5" style="background:var(--lf-mint-100)">
              <i data-lucide="dumbbell" class="w-4 h-4" style="color:var(--lf-mint-600)"></i>
            </div>
            <span class="text-[10px] text-center leading-tight" style="color:var(--lf-foreground)">运动健将</span>
          </div>
          <div class="rounded-[16px] p-3 flex flex-col items-center" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border:1px solid var(--lf-border)">
            <div class="w-9 h-9 rounded-full flex items-center justify-center mb-1.5" style="background:var(--lf-mint-100)">
              <i data-lucide="apple" class="w-4 h-4" style="color:var(--lf-mint-600)"></i>
            </div>
            <span class="text-[10px] text-center leading-tight" style="color:var(--lf-foreground)">健康饮食</span>
          </div>
        </div>
      </section>

      <!-- ===== SETTINGS GROUPS ===== -->
      <section class="px-4 mt-4 space-y-4">

        <!-- Group 1 — AI 配置 -->
        <div>
          <h2 class="text-xs font-medium mb-2 px-1" style="color:var(--lf-muted-foreground)">AI 配置</h2>
          <div class="overflow-hidden rounded-[16px] divide-y" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border-color:var(--lf-border)">
            <!-- Row 1: AI 模型 -->
            <div class="flex items-center justify-between px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <div class="flex items-center gap-3">
                <i data-lucide="brain" class="w-5 h-5 shrink-0" style="color:var(--lf-primary)"></i>
                <span class="text-sm" style="color:var(--lf-foreground)">AI 模型</span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-xs lf-num" style="color:var(--lf-muted-foreground)">GPT-4o</span>
                <i data-lucide="chevron-right" class="w-4 h-4" style="color:var(--lf-muted-foreground)"></i>
              </div>
            </div>
            <!-- Row 2: API Key input -->
            <div class="flex items-center gap-3 px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <i data-lucide="key" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i>
              <span class="text-sm shrink-0" style="color:var(--lf-foreground)">API Key</span>
              <input type="password" placeholder="••••••••" class="flex-1 text-sm bg-transparent border-none outline-none min-w-0" style="color:var(--lf-foreground)">
            </div>
            <!-- Row 3: Save button -->
            <div class="px-4 py-3.5" style="border-color:var(--lf-border)">
              <button id="cta-save-ai-config" class="w-full rounded-[12px] px-4 py-2 text-xs font-medium" style="background:var(--lf-primary);color:var(--lf-primary-foreground)">保存配置</button>
            </div>
          </div>
        </div>

        <!-- Group 2 — 数据管理 -->
        <div>
          <h2 class="text-xs font-medium mb-2 px-1" style="color:var(--lf-muted-foreground)">数据管理</h2>
          <div class="overflow-hidden rounded-[16px] divide-y" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border-color:var(--lf-border)">
            <!-- Row 1: 备份数据 -->
            <button id="cta-backup" class="w-full flex items-center justify-between px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <div class="flex items-center gap-3">
                <i data-lucide="download" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i>
                <span class="text-sm" style="color:var(--lf-foreground)">备份数据</span>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color:var(--lf-muted-foreground)"></i>
            </button>
            <!-- Row 2: 恢复数据 -->
            <button id="cta-restore" class="w-full flex items-center justify-between px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <div class="flex items-center gap-3">
                <i data-lucide="upload" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i>
                <span class="text-sm" style="color:var(--lf-foreground)">恢复数据</span>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color:var(--lf-muted-foreground)"></i>
            </button>
            <!-- Row 3: 导出 CSV -->
            <button id="cta-export-csv" class="w-full flex items-center justify-between px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <div class="flex items-center gap-3">
                <i data-lucide="file-text" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i>
                <span class="text-sm" style="color:var(--lf-foreground)">导出 CSV</span>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color:var(--lf-muted-foreground)"></i>
            </button>
            <!-- Row 4: 数据同步 toggle -->
            <div class="flex items-center justify-between px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <div class="flex items-center gap-3">
                <i data-lucide="refresh-cw" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i>
                <span class="text-sm" style="color:var(--lf-foreground)">数据同步</span>
              </div>
              <button role="switch" aria-checked="true" class="relative w-11 h-6 rounded-full transition-colors" style="background:var(--lf-primary)">
                <span class="absolute top-0.5 right-0.5 w-5 h-5 rounded-full" style="background:var(--lf-primary-foreground)"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Group 3 — 食材库 -->
        <div>
          <h2 class="text-xs font-medium mb-2 px-1" style="color:var(--lf-muted-foreground)">食材库</h2>
          <div class="overflow-hidden rounded-[16px] divide-y" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border-color:var(--lf-border)">
            <!-- Row 1: 食材数据库 -->
            <button class="w-full flex items-center justify-between px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <div class="flex items-center gap-3">
                <i data-lucide="database" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i>
                <span class="text-sm" style="color:var(--lf-foreground)">食材数据库</span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-xs lf-num" style="color:var(--lf-muted-foreground)">12,580 条</span>
                <i data-lucide="chevron-right" class="w-4 h-4" style="color:var(--lf-muted-foreground)"></i>
              </div>
            </button>
            <!-- Row 2: 添加自定义食材 -->
            <button class="w-full flex items-center justify-between px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <div class="flex items-center gap-3">
                <i data-lucide="plus-circle" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i>
                <span class="text-sm" style="color:var(--lf-foreground)">添加自定义食材</span>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color:var(--lf-muted-foreground)"></i>
            </button>
          </div>
        </div>

        <!-- Group 4 — 关于 -->
        <div>
          <h2 class="text-xs font-medium mb-2 px-1" style="color:var(--lf-muted-foreground)">关于</h2>
          <div class="overflow-hidden rounded-[16px] divide-y" style="background:var(--lf-card);box-shadow:var(--lf-shadow-1);border-color:var(--lf-border)">
            <!-- Row 1: 关于 LocalFit AI -->
            <button class="w-full flex items-center justify-between px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <div class="flex items-center gap-3">
                <i data-lucide="info" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i>
                <span class="text-sm" style="color:var(--lf-foreground)">关于 LocalFit AI</span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-xs lf-num" style="color:var(--lf-muted-foreground)">v1.0.0</span>
                <i data-lucide="chevron-right" class="w-4 h-4" style="color:var(--lf-muted-foreground)"></i>
              </div>
            </button>
            <!-- Row 2: 检查更新 -->
            <button class="w-full flex items-center justify-between px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <div class="flex items-center gap-3">
                <i data-lucide="download-cloud" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i>
                <span class="text-sm" style="color:var(--lf-foreground)">检查更新</span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-xs lf-num" style="color:var(--lf-muted-foreground)">v1.0.0</span>
                <i data-lucide="chevron-right" class="w-4 h-4" style="color:var(--lf-muted-foreground)"></i>
              </div>
            </button>
            <!-- Row 3: 清除所有数据 -->
            <button id="cta-clear-data" class="w-full flex items-center justify-between px-4 min-h-[52px] py-3.5" style="border-color:var(--lf-border)">
              <div class="flex items-center gap-3">
                <i data-lucide="trash-2" class="w-5 h-5 shrink-0" style="color:var(--lf-state-error)"></i>
                <span class="text-sm" style="color:var(--lf-state-error)">清除所有数据</span>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color:var(--lf-muted-foreground)"></i>
            </button>
          </div>
        </div>

        <!-- Group 5 — Danger zone warning -->
        <p class="text-xs text-center mt-2" style="color:var(--lf-state-error);opacity:0.7">清除数据后不可恢复，请谨慎操作</p>

        <p class="text-xs text-center mt-3 lf-num" style="color:var(--lf-muted-foreground)">LocalFit AI v1.0.0</p>

      </section>
    </main>

    <!-- ===== BOTTOM NAV ===== -->
    <nav data-mobile-nav="global" class="relative w-full max-w-md mx-auto grid grid-cols-5 h-[64px] items-center px-2 border-t border-[var(--lf-border)] bg-[var(--lf-card)]/95 backdrop-blur"><div class="w-full contents"><a data-nav-key="dashboard" data-dom-id="nav-dashboard" class="min-w-0 flex flex-col items-center justify-center gap-0.5 h-full"><i data-lucide="home" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i><span class="text-[10px] leading-none whitespace-nowrap" style="color:var(--lf-muted-foreground)">今日</span></a><a data-nav-key="nutrition" data-dom-id="nav-nutrition" class="min-w-0 flex flex-col items-center justify-center gap-0.5 h-full"><i data-lucide="utensils" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i><span class="text-[10px] leading-none whitespace-nowrap" style="color:var(--lf-muted-foreground)">饮食</span></a><a data-nav-key="ai" data-dom-id="nav-ai-workbench" class="min-w-0 flex flex-col items-center justify-center gap-0.5 h-full"><span class="flex items-center justify-center w-14 h-14 rounded-full -mt-4" style="background:linear-gradient(135deg,var(--lf-mint-500),var(--lf-mint-600));box-shadow:0 0 0 2px var(--lf-background),0 4px 12px rgba(47,190,143,0.3)"><i data-lucide="sparkles" class="w-5 h-5 shrink-0" style="color:#fff"></i></span><span class="text-[10px] leading-none whitespace-nowrap" style="color:var(--lf-muted-foreground)">AI</span></a><a data-nav-key="training" data-dom-id="nav-training" class="min-w-0 flex flex-col items-center justify-center gap-0.5 h-full"><i data-lucide="dumbbell" class="w-5 h-5 shrink-0" style="color:var(--lf-muted-foreground)"></i><span class="text-[10px] leading-none whitespace-nowrap" style="color:var(--lf-muted-foreground)">训练</span></a><a data-nav-key="settings" data-dom-id="nav-settings" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 h-full"><i data-lucide="user" class="w-5 h-5 shrink-0" style="color:var(--lf-primary)"></i><span class="text-[10px] leading-none whitespace-nowrap" style="color:var(--lf-primary);font-weight:500">我的</span></a></div></nav>

    <script>lucide.createIcons();</script>
</body>
